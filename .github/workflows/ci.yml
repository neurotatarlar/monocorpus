name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            python:
              - "src/**"
              - "tests/**"
              - "requirements.txt"
              - "Makefile"
              - "ruff.toml"

  lint:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: pip install ruff
      - name: Run lint
        run: make lint

  test:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: make test

  no_runtime_changes:
    needs: changes
    if: needs.changes.outputs.python != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Skip runtime checks
        run: echo "No runtime-related Python changes detected. Skipping lint/tests."

  ci:
    name: CI Gate
    needs:
      - lint
      - test
      - no_runtime_changes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required job results
        run: |
          echo "lint=${{ needs.lint.result }}"
          echo "test=${{ needs.test.result }}"
          echo "no_runtime_changes=${{ needs.no_runtime_changes.result }}"
          if [ "${{ needs.no_runtime_changes.result }}" = "success" ]; then
            exit 0
          fi
          if [ "${{ needs.lint.result }}" = "success" ] && [ "${{ needs.test.result }}" = "success" ]; then
            exit 0
          fi
          echo "CI checks failed or did not run as expected."
          exit 1
